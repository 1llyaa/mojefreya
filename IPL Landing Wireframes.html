    let template = JSON.parse(templateEl.textContent);

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

een;border-bottom:1px solid #ece1d5\">\n<span style=\"font:400 24px/1 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Lumé<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:8px;font:500 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27\">Košík<span style=\"min-width:24px;height:24px;box-sizing:border-box;border-radius:12px;background:#2e2a27;color:#faf6f1;font:600 14px/24px 'Instrument Sans',system-ui,sans-serif;text-align:center;padding:0 8px\">0<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:24px 16px;background:#faf6f1;display:flex;flex-direction:column;gap:12px\">\n<h1 style=\"margin:0;font:400 32px/1.14 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Trvale hladká pokožka bez holení<\u002Fh1>\n<div style=\"box-sizing:border-box;height:56px;border-radius:8px;background:repeating-linear-gradient(135deg,#efe5d9 0 8px,#f5eee5 8px 16px)\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<p style=\"margin:0 0 8px;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#2e2a27\">B · S KOTVOVOU NAVIGACÍ<\u002Fp>\n<div class=\"dv-card\" style=\"width:390px\">\n<div style=\"background:#faf6f1;padding:12px 16px;display:flex;align-items:center;justify-content:space-between\">\n<span style=\"font:400 24px/1 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Lumé<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:8px;font:500 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27\">Košík<span style=\"min-width:24px;height:24px;box-sizing:border-box;border-radius:12px;background:#2e2a27;color:#faf6f1;font:600 14px/24px 'Instrument Sans',system-ui,sans-serif;text-align:center;padding:0 8px\">0<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#faf6f1;border-bottom:1px solid #ece1d5;padding:0 16px;display:flex;gap:24px;overflow:hidden\">\n<span style=\"padding:12px 0;font:500 14px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;border-bottom:2px solid #2e2a27;white-space:nowrap\">Jak funguje<\u002Fspan>\n<span style=\"padding:12px 0;font:400 14px 'Instrument Sans',system-ui,sans-serif;color:#5f564f;white-space:nowrap\">O produktu<\u002Fspan>\n<span style=\"padding:12px 0;font:400 14px 'Instrument Sans',system-ui,sans-serif;color:#5f564f;white-space:nowrap\">Dotazy<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:24px 16px;background:#faf6f1;display:flex;flex-direction:column;gap:12px\">\n<h1 style=\"margin:0;font:400 32px/1.14 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Trvale hladká pokožka bez holení<\u002Fh1>\n<div style=\"box-sizing:border-box;height:56px;border-radius:8px;background:repeating-linear-gradient(135deg,#efe5d9 0 8px,#f5eee5 8px 16px)\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<p style=\"margin:0 0 8px;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#2e2a27\">C · MINIMÁLNÍ<\u002Fp>\n<div class=\"dv-card\" style=\"width:390px\">\n<div style=\"background:#faf6f1;padding:16px;text-align:center;border-bottom:1px solid #ece1d5\">\n<span style=\"font:400 24px/1 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Lumé<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:24px 16px;background:#faf6f1;display:flex;flex-direction:column;gap:12px\">\n<h1 style=\"margin:0;font:400 32px/1.14 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Trvale hladká pokožka bez holení<\u002Fh1>\n<div style=\"box-sizing:border-box;height:56px;border-radius:8px;background:repeating-linear-gradient(135deg,#efe5d9 0 8px,#f5eee5 8px 16px)\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"width:330px;flex:none;display:flex;flex-direction:column;gap:16px\">\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">DOPORUČENÍ: A<\u002Fp>\n<p style=\"margin:0 0 10px;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\"><strong>Topbar nese fakta, ne urgenci.<\u002Fstrong> „Doprava 99 Kč · 60 dní na vrácení“ je přesně to, co podle Baymardu chybí nejčastěji — a zopakováním nahoře i ve foldu se to dostane před oči i tomu, kdo přijde z reklamy a hned scrolluje. Žádný countdown, žádné „X lidí sleduje“.<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\"><strong>Bez navigace.<\u002Fstrong> Jednoproduktový shop — každý odkaz v headeru je cesta pryč od CTA. Značka vlevo, košík vpravo, nic víc.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">PROČ NE B<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Kotvová navigace dává smysl u dlouhé stránky s hodnocením — dokud nemáte recenze, jsou to tři odkazy do sekcí, které jsou stejně na jeden scroll. Navigační řádek měří 44 px, tedy <strong>88 % z 50px rezervy<\u002Fstrong> (celý stack 92 px proti 74 px u A). Ber jako A/B kandidáta později, ne do launche.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">PROČ NE C<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Chybí přístup do košíku — kdo se vrátí z checkoutu nebo zavře košíkovou vrstvu, nemá kam kliknout. Stack 57 px, tedy <strong>úspora 17 px<\u002Fstrong> proti A (ne celý topbar — vlastní header je o 8 px vyšší). Za 17 px slepá ulička.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">CHOVÁNÍ + POZNÁMKY<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">\n<div><strong>Header nesticky.<\u002Fstrong> Sticky je dole cena + CTA; dva lepivé pruhy na 640px displeji sežerou 120 px výšky. Header odscrolluje.<\u002Fdiv>\n<div><strong>Topbar taky odscrolluje<\u002Fstrong> a nevrací se.<\u002Fdiv>\n<div><strong>„Lumé“ je zástupné jméno<\u002Fstrong>, ne návrh značky — jen aby bylo vidět, jak wordmark v Instrument Serifu sedí. Až bude logo, přizpůsobí se mu accent.<\u002Fdiv>\n<div><strong>Košík textem, ne ikonou.<\u002Fstrong> Do dodání ikonového setu je „Košík“ + počet jednoznačnější a je to zároveň větší tap target než 24px ikona.<\u002Fdiv>\n<div><strong>Fold s variantou A:<\u002Fstrong> topbar 25 + header 49 = <strong>74 px<\u002Fstrong> nad H1 (topbar zeštíhlen z 33 px, aby se to vešlo). Se zapnutými recenzemi: 428 + 74 = 502 proti 478 dostupným → přetečení 24 px, z fotky zůstane vidět 50 ze 74 px. <strong>Bez recenzního bloku 397 + 74 = 471 → vejde se s rezervou 7 px<\u002Fstrong>, tj. stav při launchi je v pořádku. Až recenze naskočí, jde dolů buď topbar, nebo fotka.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"5b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#5b\">5b<\u002Fa>Obchodní podmínky — kostra<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:390px;background:#faf6f1\">\n<div style=\"background:#2e2a27;padding:4px 16px;text-align:center;font:400 14px 'Instrument Sans',system-ui,sans-serif;color:#e4dbd2\">Doprava 99 Kč · 60 dní na vrácení<\u002Fdiv>\n<div style=\"background:#faf6f1;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ece1d5\">\n<span style=\"font:400 24px/1 'Instrument Serif',Georgia,serif;color:#2e2a27\">Lumé<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:8px;font:500 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27\">Košík<span style=\"min-width:24px;height:24px;box-sizing:border-box;border-radius:12px;background:#2e2a27;color:#faf6f1;font:600 14px/24px 'Instrument Sans',system-ui,sans-serif;text-align:center;padding:0 8px\">0<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"padding:32px 16px 24px\">\n<h1 style=\"margin:0 0 8px;font:400 32px/1.16 'Instrument Serif',Georgia,serif;color:#2e2a27;letter-spacing:-.01em\">Obchodní podmínky<\u002Fh1>\n<p style=\"margin:0;font:400 14px 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">Účinné od [datum] · verze 1.0<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding:0 16px 24px\">\n<div style=\"background:#f6efe7;border:1px solid #e0cfbe;border-radius:10px;padding:16px\">\n<p style=\"margin:0 0 8px;font:600 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27\">Kostra, ne právní text<\u002Fp>\n<p style=\"margin:0;font:400 14px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">Každá sekce níž vypisuje, co musí obsahovat. Finální znění vygenerujte u advokátní kanceláře nebo nechte zkontrolovat právníkem — dřív, než pustíte reálné objednávky.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 16px 32px\">\n<p style=\"margin:0 0 12px;font:600 14px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;letter-spacing:.04em\">OBSAH<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid #e8ded3\">\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">1<\u002Fspan>Úvodní ustanovení<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">2<\u002Fspan>Uzavření kupní smlouvy<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">3<\u002Fspan>Cena a platební podmínky<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">4<\u002Fspan>Dodací podmínky<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">5<\u002Fspan>Odstoupení od smlouvy<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">6<\u002Fspan>Reklamační řád<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">7<\u002Fspan>Ochrana osobních údajů<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">8<\u002Fspan>Mimosoudní řešení sporů<\u002Fa>\n<a href=\"#\" style=\"padding:12px 0;border-bottom:1px solid #e8ded3;font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#2e2a27;text-decoration:none;display:flex;gap:12px\"><span style=\"color:#6e645c;min-width:20px\">9<\u002Fspan>Závěrečná ustanovení<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;padding:32px 16px;display:flex;flex-direction:column;gap:32px\">\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">1 · Úvodní ustanovení<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Prodávající: [název firmy], IČO [xxx], DIČ [xxx nebo „neplátce DPH“], se sídlem [adresa].<\u002Fp>\n<p style=\"margin:0\">Rozlišení kupujícího na spotřebitele a podnikatele — má právní důsledky u odstoupení i reklamace.<\u002Fp>\n<p style=\"margin:0\">Vztah se řídí zákonem č. 89/2012 Sb., občanský zákoník, a zákonem č. 634/1992 Sb., o ochraně spotřebitele.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">2 · Uzavření kupní smlouvy<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Odeslání objednávky přes web je návrhem na uzavření smlouvy.<\u002Fp>\n<p style=\"margin:0\">Smlouva je uzavřena potvrzením objednávky prodávajícím — u Shopify automatickým potvrzovacím e-mailem.<\u002Fp>\n<p style=\"margin:0\">Možnost objednávku před odesláním zkontrolovat a opravit.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">3 · Cena a platební podmínky<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Ceny jsou uvedeny [včetně / bez] DPH — podle toho, zda jste plátce.<\u002Fp>\n<p style=\"margin:0\">Způsoby platby: karta, dobírka [+ převod, pokud nabízíte]. Musí odpovídat tomu, co je reálně zapnuté v Shopify Payments.<\u002Fp>\n<p style=\"margin:0\">Splatnost ceny.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">4 · Dodací podmínky<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Způsoby dopravy: [kurýr / výdejní místo / Zásilkovna].<\u002Fp>\n<p style=\"margin:0\">Cena dopravy 99 Kč [případně od jaké částky zdarma] — musí souhlasit s topbarem, foldem i feedem do zbožáků.<\u002Fp>\n<p style=\"margin:0\">Orientační doba dodání a co se stane při nepřevzetí zásilky.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">5 · Odstoupení od smlouvy<\u002Fh2>\n<div style=\"background:#f6efe7;border:1px solid #e0cfbe;border-radius:10px;padding:16px;margin-bottom:12px\">\n<p style=\"margin:0;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#2e2a27\"><strong>Pozor na dvě lhůty.<\u002Fstrong> Zákonných 14 dní se nedá zkrátit. Vaše nabídka 60 dní je smluvní nadstavba — formulujte je odděleně, ať je jasné, co je zákon a co váš benefit.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Spotřebitel má právo odstoupit do 14 dnů bez udání důvodu; nad to nabízíme 60 dní.<\u002Fp>\n<p style=\"margin:0\">Jak odstoupení provést — formulář, e-mail, dopis. Odkaz na formulář.<\u002Fp>\n<p style=\"margin:0\">Vrácení peněz do 14 dnů od odstoupení.<\u002Fp>\n<p style=\"margin:0\">Kdo hradí náklady na vrácení zboží.<\u002Fp>\n<p style=\"margin:0\">Výjimky z práva na odstoupení — u IPL epilátoru pravděpodobně žádné podstatné, ověřte.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">6 · Reklamační řád<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Záruční doba 2 roky u spotřebního zboží dle občanského zákoníku.<\u002Fp>\n<p style=\"margin:0\">Kam a jak reklamaci uplatnit — e-mail, adresa, případně formulář.<\u002Fp>\n<p style=\"margin:0\">Lhůta na vyřízení reklamace 30 dní ze zákona.<\u002Fp>\n<p style=\"margin:0\">Co je vada (nefunkčnost, rozpor s popisem) a co ne (běžné opotřebení, spotřební části).<\u002Fp>\n<p style=\"margin:0\">Práva z vadného plnění — oprava, výměna, sleva, odstoupení podle závažnosti vady.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">7 · Ochrana osobních údajů<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">Krátká zmínka a odkaz na <a href=\"#\" style=\"color:#2e2a27;text-decoration:underline;text-underline-offset:3px\">samostatnou stránku GDPR<\u002Fa> — celý text se neopakuje.<\u002Fp>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">8 · Mimosoudní řešení sporů<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Povinná informace u spotřebitelských smluv: možnost obrátit se na Českou obchodní inspekci.<\u002Fp>\n<p style=\"margin:0\">Odkaz na aktuální platformu ČOI pro mimosoudní řešení sporů — ověřte adresu před spuštěním.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<h2 style=\"margin:0 0 12px;font:400 24px/1.25 'Instrument Serif',Georgia,serif;color:#2e2a27\">9 · Závěrečná ustanovení<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px;font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif;color:#5f564f\">\n<p style=\"margin:0\">Platnost a účinnost podmínek.<\u002Fp>\n<p style=\"margin:0\">Změny podmínek — pro objednávku platí znění účinné v době jejího odeslání.<\u002Fp>\n<p style=\"margin:0\">Datum poslední aktualizace.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u Fstrong><br>sekundární text · 6,7:1<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;flex:none;border-radius:6px;background:#a62b4d\"><\u002Fspan><div><strong>#A62B4D<\u002Fstrong> · 10 %<br>accent — jen CTA · bílý text <strong>6,8:1<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">TYPOGRAFIE — 2 ŘEZY<\u002Fp>\n<p style=\"margin:0 0 6px;font:400 22px/1.2 'Instrument Serif',Georgia,serif;color:#222\">Instrument Serif<\u002Fp>\n<p style=\"margin:0 0 12px;font:400 12px/1.5 system-ui,sans-serif;color:#4a4a4a\">H1 32px/1.14, H2 24px. Nese „beauty“ tón — bez toho, aby byl holčičí. Fallback Georgia.<\u002Fp>\n<p style=\"margin:0 0 6px;font:600 18px 'Instrument Sans',system-ui,sans-serif;color:#222\">Instrument Sans<\u002Fp>\n<p style=\"margin:0;font:400 12px/1.5 system-ui,sans-serif;color:#4a4a4a\">Vše funkční: body 16/1.5, CTA 20, cena 20/24, mikrocopy 14 — vše na škále 14/16/20/24/32. Stejná rodina jako serif → ladí bez ladění.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">ROZHODNUTÍ<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:10px;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">\n<div><strong>Accent nikde jinde.<\u002Fstrong> Zvýrazněná USP karta, hvězdičky ani „Ušetříte“ accent nepoužívají — jen teplý tón a rám. Na stránce je přesně jedno syté místo, dvakrát (CTA ve foldu + sticky).<\u002Fdiv>\n<div><strong>H1 zkráceno.<\u002Fstrong> „IPL epilátor —“ z H1 vypadlo; produkt je v title, v podnadpisu i ve feedu. Serif na 32 px potřebuje kratší řádek než sans.<\u002Fdiv>\n<div><strong>Fold 392 px<\u002Fstrong> (přeměřeno, o 14 px méně než <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>). Zkrácené H1 ubralo 30 px, srovnání typografické škály a větší padding část vrátily. Na 360 px šířky <strong>428 px<\u002Fstrong> proti ~478 dostupným → <strong>rezerva 50 px<\u002Fstrong>. Serif se láme jinak než sans, takže je to změřené na 4a, ne zděděné.<\u002Fdiv>\n<div><strong>Elevace.<\u002Fstrong> Úroveň 1 jemný stín na CTA, úroveň 2 výraznější na sticky baru — podle briefu.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">RECENZE — PODMÍNKA PRO VÝVOJ<\u002Fp>\n<p style=\"margin:0 0 10px;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">★ 4,8 / 128 recenzí v rámu je <em>ukázkové číslo<\u002Fem>, ne obsah k nasazení. Fake recenze = riziko zamítnutí Meta Ads i klamavá obchodní praktika.<\u002Fp>\n<div style=\"background:#f7f6f3;border-radius:6px;padding:12px;font:400 12px/1.6 ui-monospace,Menlo,monospace;color:#333\">renderovat blok<br>pouze pokud<br><strong>reviewCount &gt;= 5<\u002Fstrong><br>&amp;&amp; avgRating &gt;= 4.0<br><br>jinak: nerenderovat<br>(žádný prázdný stav)<\u002Fdiv>\n<p style=\"margin:10px 0 0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Bez bloku má fold 360 px (na 360 px šířky 397 px), tj. rezerva 81 px.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">CO JEŠTĚ CHYBÍ<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Ikonový set u USP a platebních metod (teď tónované plochy), produktové fotky, logo. Pokud logo vznikne, accent se přizpůsobí jemu — zbytek palety je neutrální a unese to.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Zkuste dál: „zkus accent v teplejší terakotě místo rose“ · „ukaž <a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa> jako desktop odvozeninu“ · „vyexportuj <a class=\"dv-oid\" href=\"#4a\">4a<\u002Fa> pro vývoj“<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t3\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t3\">3<\u002Fa><span class=\"dv-tname\">Iterace <a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa> — fold změřen a vejde se na 360×640<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"3a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa>Fold 451 → 406 px · nic z jádra neškrtnuto<\u002Fdiv>\n<div style=\"display:flex;gap:20px;align-items:flex-start\">\n<div class=\"dv-card\" style=\"width:390px\">\n<div style=\"padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px\">\n<h1 style=\"margin:0;font:700 28px/1.18 system-ui,sans-serif;color:#222;text-wrap:pretty\">IPL epilátor — trvale hladká pokožka bez holení<\u002Fh1>\n<p style=\"margin:0;font:400 16px/1.5 system-ui,sans-serif;color:#4a4a4a\">Bezbolestné odstranění chloupků doma.<\u002Fp>\n<div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font:700 24px system-ui,sans-serif;color:#222\">1 999 Kč<\u002Fspan><span style=\"font:400 16px system-ui,sans-serif;color:#767676;text-decoration:line-through\">3 999 Kč<\u002Fspan><span style=\"font:600 13px system-ui,sans-serif;color:#4a4a4a\">Ušetříte 2 000 Kč<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;border:1.5px dashed #b0b0b0;border-radius:8px;padding:6px 10px\"><span style=\"font:400 15px system-ui,sans-serif;color:#4a4a4a;letter-spacing:.06em\">★★★★★<\u002Fspan><span style=\"font:600 15px system-ui,sans-serif;color:#222\">4,8<\u002Fspan><span style=\"font:400 14px system-ui,sans-serif;color:#4a4a4a\">(128 recenzí)<\u002Fspan><\u002Fdiv>\n<span style=\"font:400 14px system-ui,sans-serif;color:#4a4a4a\">Doprava 99 Kč · 60 dní na vrácení<\u002Fspan>\n<button style=\"width:100%;min-height:52px;border:none;border-radius:10px;background:#b8492e;color:#fff;font:600 19px system-ui,sans-serif;cursor:pointer\">Přidat do košíku<\u002Fbutton>\n<span style=\"font:400 13px system-ui,sans-serif;color:#4a4a4a;text-align:center\">Platba kartou i na dobírku<\u002Fspan>\n<div style=\"box-sizing:border-box;height:74px;border:1.5px solid #2b2b2b;border-radius:12px 10px 14px 9px;background:repeating-linear-gradient(45deg,#e8e5e0 0 6px,#f4f2ee 6px 12px);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font:400 10px ui-monospace,Menlo,monospace;color:#6b6b6b\">produktová fotka — nařízlá foldem<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:6px 16px;background:#faf9f7;border-top:1px dashed #d9d9d9;border-bottom:1px dashed #d9d9d9;font:400 12px/1.5 Kalam,cursive;color:#6b6b6b\">Konec foldu na 360×640. Cena, úspora, doprava/vrácení a CTA zůstaly celé — ušetřeno na podnadpisu, paddingu boxu a přesných 74 px u fotky.<\u002Fdiv>\n\n<div style=\"padding:32px 16px 24px\">\n<h2 style=\"margin:0 0 16px;font:700 20px system-ui,sans-serif;color:#222\">Proč IPL epilátor<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;gap:12px;align-items:flex-start;background:#f2ede6;border:1.5px solid #2b2b2b;border-radius:10px;padding:16px\"><div style=\"width:32px;height:32px;flex:none;border:1.5px solid #2b2b2b;border-radius:8px;background:#e0d8cd\"><\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Dostupnější než laser studio<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Zaplatí se během jedné sezóny — místo opakovaných návštěv.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start;background:#faf9f7;border-radius:10px;padding:16px\"><div style=\"width:32px;height:32px;flex:none;border:1.5px solid #2b2b2b;border-radius:8px;background:#e8e5e0\"><\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Rychlé výsledky<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Znatelný pokles ochlupení po 1–3 aplikacích.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start;background:#faf9f7;border-radius:10px;padding:16px\"><div style=\"width:32px;height:32px;flex:none;border:1.5px solid #2b2b2b;border-radius:8px;background:#e8e5e0\"><\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Bezbolestné a bezpečné<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Šetrné k pokožce, vhodné i pro citlivé partie.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:flex-start;background:#faf9f7;border-radius:10px;padding:16px\"><div style=\"width:32px;height:32px;flex:none;border:1.5px solid #2b2b2b;border-radius:8px;background:#e8e5e0\"><\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Použitelné téměř všude<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Nohy, podpaží, bikiny, obličej.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:32px 16px;background:#faf9f7\">\n<h2 style=\"margin:0 0 20px;font:700 20px system-ui,sans-serif\">Jak to funguje<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;gap:16px\"><div style=\"width:28px;height:28px;flex:none;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px system-ui,sans-serif\">1<\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Oholit<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Pokožku před aplikací oholte, světlo se lépe dostane ke kořínkům.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:16px\"><div style=\"width:28px;height:28px;flex:none;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px system-ui,sans-serif\">2<\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Nastavit a přiložit<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Nastavte intenzitu, přiložte kolmo k pokožce, aktivujte záblesk.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:16px\"><div style=\"width:28px;height:28px;flex:none;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px system-ui,sans-serif\">3<\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">Posouvat<\u002Fp><p style=\"margin:0;font:400 14px/1.4 system-ui,sans-serif;color:#4a4a4a\">Posouvejte po dalších částech pokožky a opakujte.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:32px 16px 24px\">\n<h2 style=\"margin:0 0 12px;font:700 20px system-ui,sans-serif\">O produktu<\u002Fh2>\n<p style=\"margin:0 0 12px;font:400 16px/1.5 system-ui,sans-serif;color:#4a4a4a\">IPL vysílá krátké pulzy světla, které pohltí melanin v chloupku a zpomalí jeho růst. Nejlépe funguje na kontrastu světlá pokožka + tmavší chloupek.<\u002Fp>\n<p style=\"margin:0;font:400 16px/1.5 system-ui,sans-serif;color:#4a4a4a\">V balení: epilátor, ochranné brýle, žiletka, adaptér, návod v češtině.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding:0 16px 32px\"><div style=\"background:#faf9f7;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;gap:12px;align-items:center\"><div style=\"width:40px;height:40px;flex:none;border:1.5px solid #2b2b2b;border-radius:50%;background:#e8e5e0\"><\u002Fdiv><div><p style=\"margin:0 0 4px;font:600 16px system-ui,sans-serif\">60 dní na vrácení<\u002Fp><p style=\"margin:0;font:400 14px system-ui,sans-serif;color:#4a4a4a\">Nesedne? Pošlete zpět a vrátíme peníze.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;border-top:1px solid #e0ddd7;padding-top:12px\"><span style=\"font:400 13px system-ui,sans-serif;color:#4a4a4a\">Přijímáme<\u002Fspan><span style=\"width:34px;height:22px;border:1px solid #b0b0b0;border-radius:3px;background:#fff\"><\u002Fspan><span style=\"width:34px;height:22px;border:1px solid #b0b0b0;border-radius:3px;background:#fff\"><\u002Fspan><span style=\"width:34px;height:22px;border:1px solid #b0b0b0;border-radius:3px;background:#fff\"><\u002Fspan><span style=\"width:34px;height:22px;border:1px solid #b0b0b0;border-radius:3px;background:#fff\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:8px 0 0;font:400 12px/1.5 Kalam,cursive;color:#808080\">ikony platebních metod přesunuty sem — ve foldu zůstal textový signál<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding:0 16px 32px\">\n<h2 style=\"margin:0 0 8px;font:700 20px system-ui,sans-serif\">Časté dotazy<\u002Fh2>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Bolí to?<\u002Fspan><span style=\"color:#767676;font-size:20px\">–<\u002Fspan><\u002Fdiv>\n<p style=\"margin:8px 0 12px;font:400 14px/1.5 system-ui,sans-serif;color:#4a4a4a\">Ne, na rozdíl od jiných metod je ošetření v podstatě bezbolestné.<\u002Fp>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Funguje to na každou pokožku?<\u002Fspan><span style=\"color:#767676;font-size:20px\">–<\u002Fspan><\u002Fdiv>\n<p style=\"margin:8px 0 12px;font:400 14px/1.5 system-ui,sans-serif;color:#4a4a4a\">Nejlépe u světlé pokožky a tmavších chloupků. U velmi světlých, šedých a zrzavých chloupků je účinnost nižší.<\u002Fp>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Kdy uvidím výsledky?<\u002Fspan><span style=\"color:#767676;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Je to bezpečné?<\u002Fspan><span style=\"color:#767676;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Mohu se mezitím holit?<\u002Fspan><span style=\"color:#767676;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Je výsledek trvalý?<\u002Fspan><span style=\"color:#767676;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#222;color:#d9d9d9;padding:32px 16px;display:flex;flex-direction:column;gap:12px;font:400 14px system-ui,sans-serif\">\n<div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"text-decoration:underline\">Obchodní podmínky<\u002Fspan><span style=\"text-decoration:underline\">Reklamační řád<\u002Fspan><span style=\"text-decoration:underline\">Ochrana osobních údajů<\u002Fspan><span style=\"text-decoration:underline\">Doprava a platba<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:12px;color:#a8a8a8;border-top:1px solid #4a4a4a;padding-top:12px;margin-top:8px\">Provozovatel: [firma], IČO [xxx], [adresa], [e-mail]<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;padding:12px 16px;border-top:1px solid #eee;box-shadow:0 -4px 16px rgba(0,0,0,.12);display:flex;gap:12px;align-items:center\">\n<div><div style=\"font:700 17px system-ui,sans-serif;color:#222\">1 999 Kč<\u002Fdiv><div style=\"font:400 12px system-ui,sans-serif;color:#767676;text-decoration:line-through\">3 999 Kč<\u002Fdiv><\u002Fdiv>\n<button style=\"flex:1;min-height:48px;border:none;border-radius:10px;background:#b8492e;color:#fff;font:600 17px system-ui,sans-serif\">Do košíku<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:330px;flex:none;display:flex;flex-direction:column;gap:16px\">\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">MĚŘENÍ FOLDU<\u002Fp>\n<p style=\"margin:0 0 10px;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Naměřeno na živém <a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>: obsah foldu <strong>451 px<\u002Fstrong> (naměřeno 472 px včetně dev labelu „FOLD 1“, který není obsah stránky), sticky bar <strong>73 px<\u002Fstrong>. Nejmenší reálná cílová zařízení mají po odečtení prohlížečového chromu a sticky baru k dispozici <strong>~478 px<\u002Fstrong> (360×640 Android, iPhone SE). Na iPhonu 13+ je rezerva ~200 px.<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Na 360 px šířky navíc H1 přeteče na 3 řádky (+33 px) a původní podnadpis taky (+24 px) → <strong>2a přetékalo o ~30 px<\u002Fstrong>. Verdikt: škrtat bylo potřeba.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">CO SE UŠETŘILO<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:9px;font:400 13px/1.5 system-ui,sans-serif;color:#4a4a4a\">\n<div><strong>Fotka: 87 → 74 px (−13)<\u002Fstrong><br>Neměnila se hodnota <code>height:74px<\u002Fcode>, jen se přidalo <code>box-sizing:border-box<\u002Fcode> — dřív se k ní přičítal padding a rám. Vizuál je teď přesně na deklarované podlaze, ne pod ní.<\u002Fdiv>\n<div><strong>Recenzní box: padding 8×12 → 6×10 (−4)<\u002Fstrong><br>Obsah beze změny.<\u002Fdiv>\n<div><strong>Podnadpis: 48 → 24 px (−24)<\u002Fstrong><br>Zkráceno na „Bezbolestné odstranění chloupků doma.“ Druhá věta o výsledcích se stejně opakuje v USP „Rychlé výsledky“.<\u002Fdiv>\n<div><strong>Řádek platby: 19 → 15 px (−4)<\u002Fstrong><br>Bez flex kontejneru pro ikony — zůstal jen text.<\u002Fdiv>\n<div style=\"border-top:1px solid #e6e3de;padding-top:9px\"><strong>Celkem −45 px → fold 406 px<\u002Fstrong> (přeměřeno na živém 3a, ne odhad). Na 360 px se dvěma přetečenými řádky ~463 px, tj. <strong>~15 px rezerva<\u002Fstrong> — vejde se, ale bez polštáře.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">PLATEBNÍ IKONY<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Přesunuty k sekci „60 dní na vrácení“, ve foldu zůstal text. Pozor: <strong>vertikálně to neušetřilo nic<\u002Fstrong> — ikony (17 px) sdílely řádek s textem (19 px), takže výšku řádku určoval text. Přesun je čistý úklid, ne úspora; místo se muselo najít jinde.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">RECENZE — PODMÍNKA PRO VÝVOJ<\u002Fp>\n<p style=\"margin:0 0 10px;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Blok v rámu ukazuje <em>cílový stav s ukázkovými čísly<\u002Fem> (★ 4,8 / 128 recenzí), ne to, co se nasadí. Původní „(0 recenzí)“ bylo rozbité — nula recenzí není trust signál, ale varování.<\u002Fp>\n<div style=\"background:#f7f6f3;border-radius:6px;padding:12px;font:400 12px/1.6 ui-monospace,Menlo,monospace;color:#333\">renderovat blok<br>pouze pokud<br><strong>reviewCount &gt;= 5<\u002Fstrong><br>&amp;&amp; avgRating &gt;= 4.0<br><br>jinak: nerenderovat<br>(žádný prázdný stav,<br>žádné rezervované místo)<\u002Fdiv>\n<p style=\"margin:10px 0 0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Nerenderovaný blok uvolní 43 px — a to je zásadní: do doby, než recenze naskočí, má fold rezervu ~58 px. Rezervu 15 px má až stav s recenzemi.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:16px\">\n<p style=\"margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#222\">NEDOTČENO<\u002Fp>\n<p style=\"margin:0;font:400 13px/1.55 system-ui,sans-serif;color:#4a4a4a\">Cena, „Ušetříte 2 000 Kč“, CTA a řádek doprava/vrácení — beze změny velikosti i pozice. Řádek doprava/vrácení navíc drží kontrast #4a4a4a z iterace 2.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Zkuste dál: „vyexportuj <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa> pro vývoj“ · „ukaž <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa> v rámu 360×640, ať je fold vidět doopravdy“ · „udělej z <a class=\"dv-oid\" href=\"#3a\">3a<\u002Fa> hi-fi s reálnými barvami“<\u002Fp>\n<\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t2\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t2\">2<\u002Fa><span class=\"dv-tname\">Iterace <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> — zapracované UX/CRO připomínky<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"2a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>1a + social proof ve foldu, anchoring, platby, cena ve sticky baru<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:390px\">\n<div style=\"padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px\">\n<div style=\"font:700 9px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#a8a8a8\">FOLD 1 · BEZ SCROLLU<\u002Fdiv>\n<h1 style=\"margin:0;font:700 28px/1.18 system-ui,sans-serif;color:#222;text-wrap:pretty\">IPL epilátor — trvale hladká pokožka bez holení<\u002Fh1>\n<p style=\"margin:0;font:400 16px/1.5 system-ui,sans-serif;color:#4a4a4a\">Bezbolestné odstranění chloupků doma, výsledky už po pár aplikacích.<\u002Fp>\n<div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font:700 24px system-ui,sans-serif;color:#222\">1 999 Kč<\u002Fspan><span style=\"font:400 16px system-ui,sans-serif;color:#767676;text-decoration:line-through\">3 999 Kč<\u002Fspan><span style=\"font:600 13px system-ui,sans-serif;color:#4a4a4a\">Ušetříte 2 000 Kč<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;border:1.5px dashed #b0b0b0;border-radius:8px;padding:8px 12px\"><span style=\"font:400 15px system-ui,sans-serif;color:#4a4a4a;letter-spacing:.06em\">★★★★★<\u002Fspan><span style=\"font:600 15px system-ui,sans-serif;color:#222\">4,8<\u002Fspan><span style=\"font:400 14px system-ui,sans-serif;color:#4a4a4a\">(0 recenzí)<\u002Fspan><span style=\"margin-left:auto;font:400 10px Kalam,cursive;color:#808080\">placeholder<\u002Fspan><\u002Fdiv>\n<span style=\"font:400 14px system-ui,sans-serif;color:#4a4a4a\">Doprava 99 Kč · 60 dní na vrácení<\u002Fspan>\n<button style=\"width:100%;min-height:52px;border:none;border-radius:10px;background:#b8492e;color:#fff;font:600 19px system-ui,sans-serif;cursor:pointer\">Přidat do košíku<\u002Fbutton>\n<div style=\"display:flex;align-items:center;gap:8px;justify-content:center\"><span style=\"font:400 13px system-ui,sans-serif;color:#4a4a4a\">Platba kartou i na dobírku<\u002Fspan><span style=\"width:26px;height:17px;border:1px solid #b0b0b0;border-radius:3px;background:#f2f0ec\"><\u002Fspan><span style=\"width:26px;height:17px;border:1px solid #b0b0b0;border-radius:3px;background:#f2f0ec\"><\u002Fspan><span style=\"width:26px;height:17px;border:1px solid #b0b0b0;border-radius:3px;background:#f2f0ec\"><\u002Fspan><\u002Fdiv>\n<div style=\"height:74px;border:1.5px solid #2b2b2b;border-radius:12px 10px 14px 9px;background:repeating-linear-gradient(45deg,#e8e5e0 0 6px,#f4f2ee 6px 12px);display:flex;align-items:flex-start;justify-content:center;padd ace-between\"><span style=\"font:600 16px system-ui,sans-serif\">Bolí to?<\u002Fspan><span style=\"color:#808080;font-size:20px\">–<\u002Fspan><\u002Fdiv>\n<p style=\"margin:8px 0 12px;font:400 14px/1.5 system-ui,sans-serif;color:#4a4a4a\">Ne, na rozdíl od jiných metod je ošetření v podstatě bezbolestné.<\u002Fp>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Funguje to na každou pokožku?<\u002Fspan><span style=\"color:#808080;font-size:20px\">–<\u002Fspan><\u002Fdiv>\n<p style=\"margin:8px 0 12px;font:400 14px/1.5 system-ui,sans-serif;color:#4a4a4a\">Nejlépe u světlé pokožky a tmavších chloupků. U velmi světlých, šedých a zrzavých je účinnost nižší.<\u002Fp>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Kdy uvidím výsledky?<\u002Fspan><span style=\"color:#808080;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Je to bezpečné?<\u002Fspan><span style=\"color:#808080;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Mohu se mezitím holit?<\u002Fspan><span style=\"color:#808080;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<div style=\"border-bottom:1px solid #d9d9d9;padding:12px 0;display:flex;justify-content:space-between\"><span style=\"font:600 16px system-ui,sans-serif\">Je výsledek trvalý?<\u002Fspan><span style=\"color:#808080;font-size:20px\">+<\u002Fspan><\u002Fdiv>\n<p style=\"margin:12px 0 0;font:400 12px/1.5 Kalam,cursive;color:#808080\">první dvě otázky rozbalené (nejčastější obava), zbytek zavřený<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#222
